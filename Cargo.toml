[package]
name = "cortex"
version = "0.1.0"
edition = "2024"
authors = ["ParaTensor Team"]
description = "High-performance cluster KV-Cache aware & PD disaggregation inference gateway"
license = "Apache-2.0"

[dependencies]
# Async Runtime & HTTP Server
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["json", "ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP Client & Streaming
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
bytes = "1.9"
futures-util = "0.3"
async-stream = "0.3"
scopeguard = "1.2"

# Concurrency & Fast In-Memory State
parking_lot = "0.12"
dashmap = "6.1"
arc-swap = "1.7"

# ZMQ Protocol
zeromq = "0.4"

# Cryptography & Hash
sha2 = "0.10"
hex = "0.4"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env"] }

# Utilities
uuid = { version = "1.12", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"

[dev-dependencies]
tokio-test = "0.4"
